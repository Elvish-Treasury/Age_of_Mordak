#define MORDAK_GENERAL_EVENTS
[event]
    name=die
    first_time_only=no
    id=alert_trait_bonus
    [filter]
        [filter_adjacent]
            trait=mordak_alert
            is_enemy=no 
            count=1-6
        [/filter_adjacent]
    [/filter]
    [store_unit]
        [filter]
            trait=mordak_alert
            [filter_adjacent]
                x,y=$x1,$y1
                is_enemy=no
            [/filter_adjacent]
        [/filter]
        variable=alert_allies
        kill=no
    [/store_unit]

    [foreach]
        array=alert_allies
        [do]
            {VARIABLE_OP this_item.experience add 1}
            [unstore_unit]
                variable=this_item
                find_vacant=no
            [/unstore_unit]
        [/do]
    [/foreach]

    {CLEAR_VARIABLE alert_allies}
[/event]
#enddef
