#define MORDAK_GENERAL_EVENTS
[event]
    name=die
    first_time_only=no
    id=alert_trait_bonus
    [filter]
        [filter_adjacent]
            trait=mordak_alert
            is_enemy=no 
            count=1-6
        [/filter_adjacent]
    [/filter]
    [store_unit]
        [filter]
            trait=mordak_alert
            [filter_adjacent]
                x,y=$x1,$y1
                is_enemy=no
            [/filter_adjacent]
        [/filter]
        variable=alert_allies
        kill=no
    [/store_unit]

    [foreach]
        array=alert_allies
        [do]
            {VARIABLE_OP this_item.experience add 1}
            [unstore_unit]
                variable=this_item
                find_vacant=no
            [/unstore_unit]
        [/do]
    [/foreach]

    {CLEAR_VARIABLE alert_allies}
[/event]

[event]
    name=capture
    first_time_only=no
    id=plundering_trait_capture
    [filter]
        trait=mordak_plundering
    [/filter]

    [filter_condition]
        [variable]
            name=owner_side
            equals=0
        [/variable]
        [or]
            [not]
            # will work in 1.19+
            #    [have_side]
            #        side=$owner_side
            #        [allied_with]
            #            side=$unit.side
            #        [/allied_with]
            #    [/have_side]
            # this is a workaround - if ally has no units, it usually has no leader, so no villas
                [have_unit]
                    side=$owner_side
                    [filter_side]
                        [allied_with]
                            side=$unit.side
                        [/allied_with]
                    [/filter_side]
                [/have_unit]
            [/not]
        [/or]
    [/filter_condition]

    [gold]
        side=$unit.side
        amount=1
    [/gold]
    [floating_text]
        x,y=$unit.x,$unit.y
        text=_ "+1 gold"
    [/floating_text]
    [sound]
        name=gold.ogg
    [/sound]
[/event]
#enddef
