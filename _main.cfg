#ifdef MULTIPLAYER
[binary_path]
    path=data/add-ons/Age_of_Mordak
[/binary_path]

[era]
    id=Age_of_Mordak
    name= _ "Age of Mordak"
    description=_ "Age of Mordak"
    require_era=yes
    {./eras/factions/knights.cfg}
    {./eras/factions/sorcerers.cfg}
    {ERA_DEFAULT}
    {QUICK_4MP_LEADERS}
    {TURNS_OVER_ADVANTAGE}
[/era]
{./utils/}
[units]
    {./units/knights/}
    {./units/sorcerers/}
[/units]
[event]
name=preload
first_time_only=no 

    [lua]
        code=<<
        function wesnoth.wml_actions.EoMa_remove_array_duplicates(cfg)
            local name = cfg.name
            local attribute = cfg.attribute

            local values = {}
            local inArray = wml.array_access.get(name)
            local outArray = {}
            for _, u in pairs(inArray) do
                if values[u[attribute]] then
                    -- skip duplicate
                else
                    values[u[attribute]] = true
                    table.insert(outArray, u)
                end
            end
            wml.array_access.set(name, outArray)
        end

        function wesnoth.wml_actions.EoMa_remember_indirectly_damaged_unit(cfg)
            wesnoth.wml_actions.store_unit{
                wml.tag.filter{
                    x=cfg.x,
                    y=cfg.y
                },
                variable="EoMa_indirectly_damaged_unit",
                mode="append"
            }
        end
        >>
    [/lua]
[/event]
#endif
