#textdomain wesnoth-Mordak
[unit_type]
    id=Mordak Iga4
    name= _ "Iga4"
    race=monster
    gender=male
    image="units/igi/iga4.png"
    hitpoints=87
    movement_type=smallfoot 
    movement=5
    [movement_costs]
        fungus=1 
    [/movement_costs]
    [defense]
        fungus=40 
    [/defense]
    experience=200
    level=4
    [abilities]
        {ABILITY_REGENERATES}
        {ABILITY_LEADERSHIP}
    [/abilities]
    alignment=chaotic
    advances_to=null 
    {AMLA_DEFAULT}
    cost=66
    usage=mixed fighter
    description= _ ""
    die_sound=hiss-big.wav
    {DEFENSE_ANIM "units/igi/iga4.png" "units/igi/iga4.png" hiss-big.wav}

    [attack]
        name=crush
        #textdomain wesnoth-units 
        description=_"crush"
        icon=attacks/touch-zombie.png
        type=impact
        range=melee
        damage=22
        number=2
    [/attack]
    [attack]
        name=thorns
        #textdomain wesnoth-units 
        description=_"thorns"
        icon=attacks/thorns.png
        type=pierce
        range=ranged
        damage=14
        number=3
        [specials]
            {WEAPON_SPECIAL_POISON}
        [/specials]
    [/attack]

    {MELEE_ANIM "crush" wose-attack.ogg wose-miss.ogg}

    [attack_anim]
        [filter_attack]
            name=thorns
        [/filter_attack]
        missile_start_time=-200
        [missile_frame]
            duration=200
            image="projectiles/thorns.png"
            image_diagonal="projectiles/thorns-ne.png"
        [/missile_frame]

        start_time=-300
        [frame]
            image="units/igi/iga4.png:100"
            halo="halo/elven/nature-halo[1~8].png"
            halo_x,halo_y=0,-12
        [/frame]
        {SOUND:HIT_AND_MISS magic-thorns-[1,2].ogg magic-thorns-miss-[1,2].ogg -100}
    [/attack_anim]
[/unit_type]
