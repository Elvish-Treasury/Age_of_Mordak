        type=pierce
        range=ranged
        damage=4
        number=6
    [/attack]

    {MELEE_ANIM "sword" {SOUND_LIST:SWORD_SWISH} {SOUND_LIST:MISS}}
    {BOW_ANIM bow bow.ogg bow-miss.ogg}
[/unit_type]
