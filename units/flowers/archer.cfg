#textdomain wesnoth-Mordak
[unit_type]
    id=Mordak Flower Archer
    name= _ "Archer"
    race=elf
    gender=male
    image="units/flowers/archer.png"
    hitpoints=32
    movement_type=woodland 
    movement=5
    experience=41
    level=1
    alignment=neutral
    advances_to=Mordak Flower Archer2,Mordak Flower Archer2b
    cost=18
