#textdomain wesnoth-Mordak
[unit_type]
    id=Mordak Flower Fighter2b
    name= _ "Bloom Assassin"
    race=elf
    ignore_race_traits=yes 
    {TRAIT_RESILIENT}
    {TRAIT_STRONG}
    {TRAIT_QUICK}
    {TRAIT_INTELLIGENT}
    gender=male
    image="units/flowers/swordsman2b.png"
    hitpoints=42
    movement_type=woodland 
    movement=6
    [abilities]
        {ABILITY_SKIRMISHER}
    [/abilities]
    experience=100
    level=2
    alignment=neutral
    advances_to=null 
    {AMLA_DEFAULT}
    cost=30
    usage=fighter
    description= _ ""
    die_sound={SOUND_LIST:ELF_HIT}

    {DEFENSE_ANIM "units/flowers/swordsman2b.png" "units/flowers/swordsman2b.png" {SOUND_LIST:ELF_HIT}}

    [attack]
        name=dagger
        #textdomain wesnoth-units 
        description=_"dagger"
        icon=attacks/slice-acid-1.png
        type=blade
        range=melee
        damage=6
        number=5
        [specials]
            {WEAPON_SPECIAL_MORDAK_COUP_DE_GRACE}
        [/specials]
    [/attack]
    [attack]
        name=throwing knives
        description=_"throwing knives"
        icon=attacks/dagger-thrown-human.png
        type=blade
        range=ranged
        damage=5
        number=4
        [specials]
           {WEAPON_SPECIAL_MORDAK_COUP_DE_GRACE}
        [/specials]
    [/attack]

    {MELEE_ANIM "dagger" dagger-swish.wav {SOUND_LIST:MISS}}
    [attack_anim]
        [filter_attack]
            name=throwing knives
        [/filter_attack]
        missile_start_time=-150
        [missile_frame]
            duration=150
            image="projectiles/dagger-n.png"
            image_diagonal="projectiles/dagger-ne.png"
        [/missile_frame]
        start_time=-250
        [frame]
            image="units/flowers/swordsman2b.png:100"
        [/frame]
        {SOUND:HIT_AND_MISS throwing-knife.ogg throwing-knife-miss.ogg -150}
    [/attack_anim]
[/unit_type]
