#textdomain wesnoth-Mordak
[unit_type]
    id=Mordak Flower Moth
    name= _ "Giant Moth"
    race=monster
    gender=male
    image="units/flowers/moth.png"
    hitpoints=28
    movement_type=smallfly
    movement=8
    experience=32
    level=1
    alignment=chaotic
    advances_to=Mordak Flower Moth2
    cost=15
    usage=scout
    description= _ ""
    die_sound=bat-flapping.wav

    {DEFENSE_ANIM "units/flowers/moth.png" "units/flowers/moth.png" {SOUND_LIST:BAT_HIT}}
    {FLOAT_STANDING_ANIM}

    [attack]
        name=magic
        #textdomain wesnoth-units 
        description=_"magic"
        icon=attacks/gaze.png
        type=cold
        range=ranged
        damage=8
        number=2
        [specials]
            {WEAPON_SPECIAL_STUN}
            {WEAPON_SPECIAL_MAGICAL}
        [/specials]
    [/attack]

    {MELEE_ANIM fangs {SOUND_LIST:MISS} {SOUND_LIST:MISS}}
    [attack_anim]
        [filter_attack]
            name=magic
        [/filter_attack]
        {MISSILE_FRAME_ICE}
        start_time=-200
        {SOUND:HIT_AND_MISS magic-dark.ogg magic-dark-miss.ogg -200}
    [/attack_anim]
[/unit_type]
