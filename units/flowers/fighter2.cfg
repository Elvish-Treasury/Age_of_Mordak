#textdomain wesnoth-Mordak
[unit_type]
    id=Mordak Flower Fighter2
    name= _ "Bloom Warrior"
    race=elf
    ignore_race_traits=yes 
    {TRAIT_RESILIENT}
    {TRAIT_STRONG}
    {TRAIT_QUICK}
    {TRAIT_INTELLIGENT}
    gender=male
    image="units/flowers/swordsman2.png"
    hitpoints=48
    movement_type=woodland 
    movement=5
    experience=89
    level=2
    alignment=neutral
    advances_to=Mordak Flower Fighter3
    cost=16
    usage=fighter
    description= _ ""
    die_sound={SOUND_LIST:ELF_HIT}

    {DEFENSE_ANIM "units/flowers/swordsman2.png" "units/flowers/swordsman2.png" {SOUND_LIST:ELF_HIT}}

    [attack]
        name=sword
        #textdomain wesnoth-units 
        description=_"sword"
        icon=attacks/sword-elven.png
        type=blade
        range=melee
        damage=8
        number=4
        [specials]
            {WEAPON_SPECIAL_POISON}
        [/specials]
    [/attack]

    {MELEE_ANIM "sword" {SOUND_LIST:SWORD_SWISH} {SOUND_LIST:MISS}}

    [attack_anim]
        [filter_attack]
            name=toxic pollen
        [/filter_attack]
        missile_start_time=-150
        [missile_frame]
            duration=150
            image="halo/elven/druid-healing4.png"
            image_diagonal="halo/elven/druid-healing4.png"
        [/missile_frame]
        start_time=-445
        [frame]
            image="units/flowers/swordsman2.png:65"
        [/frame]
        {SOUND:HIT_AND_MISS magicmissile.wav magicmissile.wav -380}
    [/attack_anim]
[/unit_type]
