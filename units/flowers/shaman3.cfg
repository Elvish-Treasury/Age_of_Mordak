#textdomain wesnoth-Mordak
[unit_type]
    id=Mordak Flower Shaman3
    name= _ "Bloom Valkyrie"
    race=elf
    gender=female
    image="units/flowers/shaman3.png"
    halo=halo/elven/shyde-stationary-halo[1~6].png:150
    hitpoints=57
    movement_type=woodlandfloat
    movement=7
    experience=150
    level=3
    [abilities]
        {ABILITY_CURES}
    [/abilities]
    alignment=neutral
    advances_to=null 
    {AMLA_DEFAULT}
    cost=40
    usage=archer
    description= _ ""
    die_sound={SOUND_LIST:ELF_FEMALE_HIT}

    {DEFENSE_ANIM "units/flowers/shaman3.png" "units/flowers/shaman3.png" {SOUND_LIST:ELF_FEMALE_HIT}}
    {FLOAT_STANDING_ANIM}

    [attack]
        name=dagger
        #textdomain wesnoth-units 
        description=_"blessing sword"
        icon=attacks/slice-acid-2.png
        type=blade
        range=melee
        damage=7
        number=4
    [/attack]
    [attack]
        name=curse
        #textdomain wesnoth-units 
        description=_"curse"
        icon=attacks/wind-grasp-acid-3.png
        type=arcane
        range=ranged
        damage=20
        number=1
        [specials]
            {WEAPON_SPECIAL_MORDAK_STATUS_STRIKE}
            {WEAPON_SPECIAL_DRAIN}
        [/specials]
    [/attack]

    {MELEE_ANIM "dagger"  {SOUND_LIST:SWORD_SWISH} {SOUND_LIST:MISS}}
    [attack_anim]
        [filter_attack]
            name=curse
        [/filter_attack]

        missile_start_time=-200
        start_time=-350
        halo1_start_time=-350
        halo2_start_time=-200
        sound_start_time=0

        [missile_frame]
            halo="halo/elven/druid-healing[8~1].png~CS(50,-30,-50):50"
            offset=1.0~0.0
        [/missile_frame]

        [frame]
            image="units/flowers/shaman3.png:600"
        [/frame]

        [halo1_frame]
            halo="halo/elven/nature-halo[8~1].png~CS(50,-30,-50)~O([80%*2,60%,40%,30%,20%*3]):75"
            offset=1.0
            auto_vflip=no
            auto_hflip=no
        [/halo1_frame]

        [halo2_frame]
            halo="halo/elven/nature-halo[1~8].png~CS(50,-30,-50)~O([20%*3,30%,40%,60%,80%*2]):75"
            offset=0.0
            auto_vflip=no
            auto_hflip=no
        [/halo2_frame]

        [sound_frame]
            sound=magic-dark-big.ogg
        [/sound_frame]
    [/attack_anim]
[/unit_type]
