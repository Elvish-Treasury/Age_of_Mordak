#textdomain wesnoth-Mordak
[unit_type]
    id=Mordak Flower Living Vine
    name= _ "Living Vine"
    race=wose
    gender=female
    image="units/flowers/parostok.png"
    hitpoints=44
    movement_type=treefolk
    movement=6
    [resistance]
        blade=120 
    [/resistance]
    [defense]
        shallow_water=70
        reef=70
        swamp_water=60
        flat=70
        sand=70
        forest=50
        hills=60
        mountains=60
        village=70
        castle=70
        cave=70
        frozen=70
        fungus=60
    [/defense]
    experience=40
    level=1
    [abilities]
        {ABILITY_AMBUSH}
        {ABILITY_REGENERATES}
    [/abilities]
    alignment=neutral
    advances_to=Mordak Flower Blessing Vine
    cost=18
    usage=fighter
    description= _ ""
    die_sound=wose-die.ogg

    {DEFENSE_ANIM "units/flowers/parostok.png" "units/flowers/parostok.png" wose-hit.ogg}

    [attack]
        name=crush
        description=_"crush"
        type=impact
        icon=attacks/vines-eerie-2.png
        damage=10
        number=2
        range=melee
        [specials]
            {WEAPON_SPECIAL_SLOW}
        [/specials]
    [/attack]

    {MELEE_ANIM "crush" wose-attack.ogg wose-miss.ogg}
    [attack_anim]
        [filter_attack]
            name=entangle
        [/filter_attack]
        missile_start_time=-200
        [missile_frame]
            offset=1.0
            duration=150
            image="projectiles/entangle.png"
            image_diagonal="projectiles/entangle.png"
        [/missile_frame]
        start_time=-450
        [frame]
            image="units/flowers/parostok.png:100"
            halo=halo/elven/nature-halo[1~6].png:75,halo/elven/nature-halo[7~8].png:50
            halo_x,halo_y=0,-12
        [/frame]
        attack_sound_start_time=-75
        [attack_sound_frame]
            sound=entangle.wav
        [/attack_sound_frame]
        [frame]
            image="units/flowers/parostok.png:100"
        [/frame]
    [/attack_anim]
[/unit_type]
