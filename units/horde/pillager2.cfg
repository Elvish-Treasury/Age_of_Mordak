#textdomain wesnoth-Mordak
#define PATH_TEMP
units/horde/#enddef

#define TORCH_STATIC_IMAGE
{PATH_TEMP}marauder2.png~BLIT({PATH_TEMP}marauder-torch-overlay.png,36,-7)#enddef

[unit_type]
    id=Mordak Horde Pillager2
    name= _ "Pillager"
    race=wolf
    gender=male
#ifndef __WMLUNITS__
    image="{TORCH_STATIC_IMAGE}"
#else
    # Shown on units.wesnoth.org instead,
    # because Image Path Functions aren't available there.
    image="{PATH_TEMP}marauder2.png"
#endif
    hitpoints=43
    movement_type=orcishfoot
    movement=8
    experience=60
    level=2
    alignment=chaotic
    advances_to=Mordak Horde Pillager3
    cost=18
    usage=scout
    description= _ ""
    die_sound={SOUND_LIST:WOLF_DIE}

    {DEFENSE_ANIM "{TORCH_STATIC_IMAGE}" "{TORCH_STATIC_IMAGE}" {SOUND_LIST:WOLF_HIT}}

    {STANDING_ANIM_SMALL_TORCH "{PATH_TEMP}marauder2.png" 18 18 -23}
    [movement_anim]
        start_time=-0
        [frame]
            image="{TORCH_STATIC_IMAGE}:150"
        [/frame]
    [/movement_anim]

    [attack]
        name=torch
        #textdomain wesnoth-units 
        description=_"torch"
        icon=attacks/torch.png
        type=fire
        range=melee
        damage=8
        number=3
        [specials]
            {WEAPON_SPECIAL_MORDAK_DEVASTATION}
        [/specials]
    [/attack]
    [attack]
        name=short bow
        description=_"short bow"
        icon=attacks/bow-orcish.png
        type=pierce
        range=ranged
        damage=7
        number=3
    [/attack]

    {MELEE_ANIM "torch" torch.ogg {SOUND_LIST:MISS}}
    [attack_anim]
        [filter_attack]
            name=short bow
        [/filter_attack]
        missile_start_time=-150
        [missile_frame]
            duration=150
            image="projectiles/missile-n.png"
            image_diagonal="projectiles/missile-ne.png"
        [/missile_frame]
        start_time=-445
        [frame]
            image="{TORCH_STATIC_IMAGE}"
        [/frame]
        {SOUND:HIT_AND_MISS bow-puny.ogg bow-puny-miss.ogg -380}
    [/attack_anim]
[/unit_type]
