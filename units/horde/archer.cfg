#textdomain wesnoth-Mordak
[unit_type]
    id=Mordak Horde Archer1
    name= _ "Archer"
    race=goblin
    gender=male
    image="units/horde/archer1.png"
    hitpoints=25
    movement_type=orcishfoot
    movement=5
    experience=26
    level=1
    alignment=chaotic
    advances_to=Mordak Horde Archer2
    cost=11
    usage=archer
    description= _ ""
    die_sound={SOUND_LIST:GOBLIN_DIE}

    {DEFENSE_ANIM "units/horde/archer1.png" "units/horde/archer1.png" {SOUND_LIST:GOBLIN_HIT}}

    [attack]
        name=cleaver
        #textdomain wesnoth-units 
        description=_"cleaver"
        icon=attacks/cleaver.png
        type=blade
        range=melee
        damage=6
        number=1
    [/attack]
    [attack]
        name=bow
        #textdomain wesnoth-units 
        description=_"bow"
        icon=attacks/bow-orcish.png
        type=pierce
        range=ranged
        damage=5
        number=3
    [/attack]

    {MELEE_ANIM "cleaver" axe.ogg {SOUND_LIST:MISS}}
    [attack_anim]
        [filter_attack]
            name=bow
        [/filter_attack]
        missile_start_time=-150
        [missile_frame]
            duration=150
            image="projectiles/missile-n.png"
            image_diagonal="projectiles/missile-ne.png"
        [/missile_frame]
        start_time=-445
        [frame]
            image="units/horde/archer1.png:65"
        [/frame]
        {SOUND:HIT_AND_MISS bow-puny.ogg bow-puny-miss.ogg -380}
    [/attack_anim]
[/unit_type]
