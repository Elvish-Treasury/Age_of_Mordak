#textdomain wesnoth-Mordak
[unit_type]
    id=Mordak Horde Hordeman
    name= _ "Goblin"
    race=goblin
    gender=male
    image="units/horde/goblin1.png"
    hitpoints=20
    movement_type=orcishfoot
    movement=5
    experience=17
    level=0
    alignment=chaotic
    advances_to=Mordak Horde Hordeman2
    cost=7
    usage=fighter
    description= _ ""
    die_sound={SOUND_LIST:GOBLIN_DIE}

    {DEFENSE_ANIM "units/horde/goblin1.png" "units/horde/goblin1.png" {SOUND_LIST:GOBLIN_HIT}}

    [attack]
        name=cleaver
        #textdomain wesnoth-units 
        description=_"cleaver"
        icon=attacks/cleaver.png
        type=blade
        range=melee
        damage=7
        number=2
    [/attack]
    [attack]
        name=hatchet 
        description=_"hatchet"
        icon=attacks/hatchet.png
        type=blade
        range=ranged
        damage=7
        number=1
    [/attack]

    {MELEE_ANIM "cleaver" axe.ogg {SOUND_LIST:MISS}}
    [attack_anim]
        [filter_attack]
            name=hatchet
        [/filter_attack]
        start_time=-550
        {MISSILE_FRAME_HATCHET}

        [frame]
            image="units/horde/goblin1.png:100"
        [/frame]
        {SOUND:HIT_AND_MISS hatchet.wav hatchet-miss.wav -150}
    [/attack_anim]
[/unit_type]
