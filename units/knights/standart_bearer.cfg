#textdomain wesnoth-Mordak
[unit_type]
    id=Mordak Order Standart Bearer
    name= _ "Standart Bearer"
    race=human
    gender=male
    image="units/knights/bannerer.png"
    hitpoints=60
    movement_type=mounted
    [resistance]
        pierce=110
        blade=70 
        impact=60
    [/resistance]
    movement=8
    experience=110
    level=2
    [abilities]
        {ABILITY_MORDAK_CAVALRY}
        {ABILITY_CURES}
    [/abilities]
    alignment=lawful
    advances_to=null 
    {AMLA_DEFAULT}
    cost=36
    usage=fighter
    description= _ ""
    die_sound=horse-die.ogg

    {DEFENSE_ANIM "units/knights/bannerer.png" "units/knights/bannerer.png" {SOUND_LIST:HORSE_HIT}}

    [attack]
        name=standart
        description=_"standart"
        icon=attacks/staff-elven-star.png
        type=blade
        range=melee
        damage=10
        number=3
    [/attack]
    [attack]
        name=lightbeam
        description=_"lightbeam"	# wmllint: no spellcheck (until name->id)
        type=arcane
        range=ranged
        [specials]
            {WEAPON_SPECIAL_MAGICAL}
        [/specials]
        damage=6
        number=4
    [/attack]
    [attack_anim]
        [filter_attack]
            name=lightbeam
        [/filter_attack]
        {MISSILE_FRAME_LIGHT_BEAM}

        start_time=-395
        [frame]
            image="units/knights/bannerer.png:150"
            halo=halo/holy/halo[6,1,3,5,6].png:[75*4,50]
        [/frame]
        {SOUND:HIT_AND_MISS {SOUND_LIST:HOLY} {SOUND_LIST:HOLY_MISS} -75}
    [/attack_anim]
    {MELEE_MOUNTED_ANIM standart horse-canter.wav axe.ogg {SOUND_LIST:MISS}}
[/unit_type]
