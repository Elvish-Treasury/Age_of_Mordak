#textdomain wesnoth-Mordak
[unit_type]
    id=Mordak Order Oathsworn Knight
    name= _ "Oathsworn Knight"
    race=human
    gender=male
    image="units/knights/knight3.png"
    hitpoints=63
    movement_type=mounted
    [resistance]
        pierce=110
        blade=70 
        impact=60
    [/resistance]
    movement=8
    experience=134
    level=3
    [abilities]
        {ABILITY_MORDAK_CAVALRY}
        {ABILITY_LEADERSHIP}
    [/abilities]
    alignment=lawful
    advances_to=Mordak Order Last Knight
    {AMLA_DEFAULT}
    cost=40
    usage=fighter
    description= _ "A knight who has reached the age and rank that allow him to take one of the Order’s ancient oaths. The oath he chooses determines the warrior’s future service and how he will be remembered after his death."
    [special_note]
        note= _ "Compared to the other Order's cavalry units, knights have better resistance to ‘blade’ and ‘impact’ attacks and are less vulnerable to ‘pierce’."
    [/special_note]
    die_sound=horse-die.ogg

    {DEFENSE_ANIM "units/knights/knight3.png" "units/knights/knight3.png" {SOUND_LIST:HORSE_HIT}}

    [attack]
        name=lance
        description=_"lance"
        icon=attacks/lance.png
        type=pierce
        range=melee
        damage=18
        number=2
        [specials]
            {WEAPON_SPECIAL_MORDAK_CAVALRY_WEDGE}
        [/specials]
    [/attack]

    {MELEE_MOUNTED_ANIM lance horse-canter.wav spear.ogg spear-miss.ogg}
[/unit_type]
