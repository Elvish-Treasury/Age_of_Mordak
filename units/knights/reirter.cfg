#textdomain wesnoth-Mordak
[unit_type]
    id=Mordak Reiter
    name= _ "Reiter"
    race=human
    gender=male
    image="units/knights/reiter.png"
    hitpoints=35
    movement_type=mounted
    movement=8
    experience=40
    level=1
    [abilities]
        {ABILITY_MORDAK_CAVALRY}
    [/abilities]
    alignment=lawful
    advances_to=Mordak Reiter2
    cost=19
    usage=archer
    description= _ "A mercenary rider from lands beyond the Order's dominion. Reiters come to Maghre for gold, protection, or the hope of surviving another war. Many conceal their faces and true names, unwilling to speak of where they came from."
    die_sound=horse-die.ogg

    {DEFENSE_ANIM "units/knights/reiter.png" "units/knights/reiter.png" {SOUND_LIST:HORSE_HIT}}

    [attack]
        name=sword
        #textdomain wesnoth-units 
        description=_"sword"
        icon=attacks/sword-human.png
        type=blade
        range=melee
        damage=5
        number=2
    [/attack]
    [attack]
        name=crossbow
        description=_"crossbow"
        icon=attacks/crossbow-iron.png
        type=pierce
        range=ranged
        damage=8
        number=2
    [/attack]

    {MELEE_MOUNTED_ANIM "sword" horse-canter.wav {SOUND_LIST:SWORD_SWISH} {SOUND_LIST:MISS}}
    {CROSSBOW_ANIM crossbow}
[/unit_type]
