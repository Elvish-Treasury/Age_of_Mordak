#textdomain wesnoth-Mordak
[unit_type]
    id=Mordak Knight4
    #textdomain wesnoth-units 
    name= _ "The Last"
    race=human
    gender=male
    image="units/knights/knight4.png"
    hitpoints=90
    movement_type=mounted
    movement=8
    [resistance]
        pierce=100
        blade=60
        impact=50
    [/resistance]
    experience=200
    level=4
    [abilities]
        {ABILITY_MORDAK_CAVALRY}
        {ABILITY_LEADERSHIP}
        {ABILITY_MORDAK_LIGHT_OATH}
        {ABILITY_LAST_OATH}
    [/abilities]
    alignment=lawful
    advances_to=null 
    {AMLA_DEFAULT}
    cost=60
    usage=fighter
    description= _ "A knight who took the Last Oath — to never fall as long as there is someone left to carry on the fight. They say that some of the Last Ones served the Order for decades, outliving their comrades and seeing generations come and go."
    die_sound=horse-die.ogg

    {DEFENSE_ANIM "units/knights/knight4.png" "units/knights/knight4.png" {SOUND_LIST:HORSE_HIT}}

    [attack]
        name=lance
        description=_"lance"
        icon=attacks/lance.png
        type=pierce
        range=melee
        damage=22
        number=2
        [specials]
            {WEAPON_SPECIAL_MORDAK_CAVALRY_WEDGE}
        [/specials]
    [/attack]

    {MELEE_MOUNTED_ANIM lance horse-canter.wav spear.ogg spear-miss.ogg}
[/unit_type]
