#textdomain wesnoth-Era_of_Magic
#KIRIOS Beam Weapon

#define HARM_BEAM_ACTION FILTER
    [harm_unit]
        [filter]
            {FILTER}
            [filter_side]
                [enemy_of]
                    side=$unit.side
                [/enemy_of]
            [/filter_side]
            [not]
                [filter_wml]
                    [status]
                        petrified=yes
                    [/status]
                [/filter_wml]
            [/not]
        [/filter]
        [filter_second]
            x,y=$x1,$y1
        [/filter_second]
        amount=$beamdmg
        damage_type=$weapon.type
        alignment=$unit.alignment
        fire_event=yes
        animate=defender
        delay=0
        experience=no
    [/harm_unit]
    [harm_unit]
        [filter]
            {FILTER}
            [filter_side]
                [allied_with]
                    side=$unit.side
                [/allied_with]
                [or]
                    side=$unit.side
                [/or]
            [/filter_side]
            [not]
                [filter_wml]
                    [status]
                        petrified=yes
                    [/status]
                [/filter_wml]
            [/not]
        [/filter]
        [filter_second]
            x,y=$x1,$y1
        [/filter_second]
        amount=$beamdmg
        damage_type=$weapon.type
        alignment=$unit.alignment
        fire_event=yes
        animate=defender
        kill=no
        delay=0
        experience=no
    [/harm_unit]
#enddef


#define EOMA_INDIRECTLY_DAMAGED_UNIT_EXPERIENCE_EVENT
    [event]
        name=attack end
        first_time_only=no
        id=eoma_indirect_damage_xp_event

        [EoMa_remove_array_duplicates]
            name=EoMa_indirectly_damaged_unit
            attribute=id
        [/EoMa_remove_array_duplicates]
        [foreach]
            array=EoMa_indirectly_damaged_unit
            [do]
                # give indirectly damaged unit fight xp
                [if]
                    [have_unit]
                        id=$this_item.id
                        [not]
                            ability=eoma_soul_catcher
                        [/not]
                    [/have_unit]
                    [then]
                        [modify_unit]
                            [filter]
                                id=$this_item.id
                            [/filter]
                            experience="$($this_unit.experience + $unit.level)"
                        [/modify_unit]
                    [/then]
                [/if]
                # give primary unit kill xp
                [if]
                    [have_unit]
                        id=$this_item.id
                    [/have_unit]
                    [else]
                        {VARIABLE expkill $this_item.level}
                        {VARIABLE_OP expkill multiply 8}
                        {IF_VAR expkill equals 0 (
                            [then]
                                {VARIABLE expkill 4}
                            [/then]
                        )}
                        [modify_unit]
                            [filter]
                                id=$unit.id
                            [/filter]
                            experience="$($this_unit.experience + $expkill)"
                        [/modify_unit]
                        {CLEAR_VARIABLE expkill}
                    [/else]
                [/if]
            [/do]
        [/foreach]

        {CLEAR_VARIABLE EoMa_indirectly_damaged_unit}
    [/event]
#enddef

#define WEAPON_SPECIAL_EOMA_BEAM
# wmlindent: start ignoring
# wmlxgettext: [attack]
# wmlxgettext: [specials]

# wmlindent: stop ignoring
    [damage]
        id=eoma_beam
        name= _ "beam"
        active_on=offense
        description=_ "When this attack is used, the attacker can hurt a unit behind his primary target and a unit behind that unit (3 units total). Damage dealt to the second target equals to 2/3 of raw firepower. Damage dealt to the third target equals to 1/3 of raw firepower.
This effect works only on offence.
This ability works even against allies.
Chance to hit secondary targets: 100% when primary attack hits."
    [/damage]
[/specials]
# wmlindent: start ignoring
[/attack]
# wmlindent: stop ignoring
[event]
    name=attacker_hits
    id=eoma_beam_event
    first_time_only=no

    [filter_attack]
        special_id=eoma_beam
    [/filter_attack]

    [store_locations]
        [filter_adjacent_location]
            x,y=$x2,$y2
            adjacent=$second_unit.facing
        [/filter_adjacent_location]
        variable=next_target
    [/store_locations]

    {VARIABLE beamdmg $weapon.damage}

    [if]
        {VARIABLE_CONDITIONAL unit.status.slowed boolean_equals yes}
        [then]
            {VARIABLE_OP beamdmg divide 2}
        [/then]
    [/if]

    {VARIABLE_OP beamdmg multiply 0.66}
    {VARIABLE_OP beamdmg round floor}

    #second
    [if]
        [have_unit]
            x,y=$next_target[0].x,$next_target[0].y
        [/have_unit]
        [then]
            [EoMa_remember_indirectly_damaged_unit]
                x,y=$next_target[0].x,$next_target[0].y
            [/EoMa_remember_indirectly_damaged_unit]
            {HARM_BEAM_ACTION (
                x,y=$next_target[0].x,$next_target[0].y
            )}
            #workaround to get unit id, since next_target is just store_location
            [store_unit]
                [filter]
                    x,y=$next_target[0].x,$next_target[0].y
                [/filter]
                variable=beam_next_target_unit
                kill=no
            [/store_unit]
            [EoMa_trigger_pain_absorbation_aura_on_location]
                x,y=$next_target[0].x,$next_target[0].y
                #in pain absorb event, primary unit should be the damaged unit
                #               primary_unit=$unit.id
                primary_unit=$beam_next_target_unit.id
            [/EoMa_trigger_pain_absorbation_aura_on_location]
            {CLEAR_VARIABLE beam_next_target_unit}
        [/then]
    [/if]

    {VARIABLE beamdmg $weapon.damage}

    [if]
        {VARIABLE_CONDITIONAL unit.status.slowed boolean_equals yes}
        [then]
            {VARIABLE_OP beamdmg divide 2}
        [/then]
    [/if]

    {VARIABLE_OP beamdmg multiply 0.33}
    {VARIABLE_OP beamdmg round floor}

    [store_locations]
        [filter_adjacent_location]
            x,y=$next_target[0].x,$next_target[0].y
            adjacent=$second_unit.facing
        [/filter_adjacent_location]
        variable=next_target
    [/store_locations]
    #third
    [if]
        [have_unit]
            x,y=$next_target[0].x,$next_target[0].y
        [/have_unit]
        [then]
            [EoMa_remember_indirectly_damaged_unit]
                x,y=$next_target[0].x,$next_target[0].y
            [/EoMa_remember_indirectly_damaged_unit]
            {HARM_BEAM_ACTION (
                x,y=$next_target[0].x,$next_target[0].y
            )}
            #workaround to get unit id, since next_target is just store_location
            [store_unit]
                [filter]
                    x,y=$next_target[0].x,$next_target[0].y
                [/filter]
                variable=beam_next_target_unit
                kill=no
            [/store_unit]
            [EoMa_trigger_pain_absorbation_aura_on_location]
                x,y=$next_target[0].x,$next_target[0].y
                #in pain absorb event, primary unit should be the damaged unit
                #               primary_unit=$unit.id
                primary_unit=$beam_next_target_unit.id
            [/EoMa_trigger_pain_absorbation_aura_on_location]
            {CLEAR_VARIABLE beam_next_target_unit}
        [/then]
    [/if]

    {CLEAR_VARIABLE beamdmg}
    {CLEAR_VARIABLE next_target}
[/event]

{EOMA_INDIRECTLY_DAMAGED_UNIT_EXPERIENCE_EVENT}

[+attack]
# wmlindent: start ignoring

[+specials]
