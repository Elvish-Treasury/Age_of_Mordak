#textdomain wesnoth-Mordak
#define TRAIT_MORDAK_HARDWORKING
    [trait]
        id=mordak_hardworking
        male_name= _ "hadrworking"
        availability="musthave"
        female_name= _ "female^hardworking"
        help_text= _ ""
        [effect]
            apply_to=hitpoints
            increase_total=2
        [/effect]
    [/trait]
#enddef

#define TRAIT_ALERT
    [trait]
        id=mordak_alert
        male_name= _ "alert"
        availability="musthave"
        female_name= _ "female^alert"
        help_text= _ "This unit learns on the fly — +1 XP whenever a nearby ally dies."
    [/trait]
#enddef
