#define MELEE_ANIM NAME SOUND_HIT SOUND_MISS
    [attack_anim]
        [filter_attack]
            name={NAME}
        [/filter_attack]
        start_time=-200
        [frame]
            duration=300
        [/frame]
        {SOUND:HIT_AND_MISS {SOUND_HIT} {SOUND_MISS} -100}
    [/attack_anim]
#enddef
#define MELEE_MOUNTED_ANIM NAME SOUND_MOUNT SOUND_HIT SOUND_MISS
    [attack_anim]
        [filter_attack]
            name={NAME}
        [/filter_attack]
        start_time=-200
        [frame]
            duration=300
            sound={SOUND_MOUNT}
        [/frame]
        {SOUND:HIT_AND_MISS {SOUND_HIT} {SOUND_MISS} -100}
    [/attack_anim]
#enddef

#define MOVEMENT_SOUND SOUND
    [movement_anim]
        [frame]
            duration=300
            sound={SOUND}
        [/frame]
    [/movement_anim]
#enddef

#define CROSSBOW_ANIM ATTACK_NAME
    [attack_anim]
        [filter_attack]
            name={ATTACK_NAME}
        [/filter_attack]
        missile_start_time=-150
        [missile_frame]
            duration=150
            image="projectiles/missile-n.png"
            image_diagonal="projectiles/missile-ne.png"
        [/missile_frame]
        start_time=-250
        {SOUND:HIT_AND_MISS crossbow.ogg crossbow-miss.ogg -200}
        [frame]
            durarion=250
        [/frame]
    [/attack_anim]
#enddef

